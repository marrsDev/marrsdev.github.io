<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting to Capital Builders</title>
    <!-- 1. Instant browser redirect -->
    <meta http-equiv="refresh" content="0; url=https://capitalbuilders.co.ke/">
    <!-- 2. STRONG canonical signal for Google (This fixes your GSC error) -->
    <link rel="canonical" href="https://capitalbuilders.co.ke/" />
    <!-- 3. JavaScript fallback redirect -->
    <script>
        window.location.href = "https://capitalbuilders.co.ke/";
    </script>
</head>
<body>
    <!-- 4. User-friendly fallback link -->
    <p>If you are not redirected, please <a href="https://capitalbuilders.co.ke/">click here to go to the homepage</a>.</p>
</body>
</html>
